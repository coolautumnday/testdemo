// 监听iframe运行时消息：NaN告警、JS异常
window.addEventListener('message',(evt)=>{
  const data = evt.data;
  if(!data || !data.type) return;
  if(data.type === "WARN_NAN"){
    sessionData.messages.push({
      role:"assistant",
      content:"🔴运行时告警："+data.msg,
      error:true
    });
    renderChat();
    saveSession();
  }else if(data.type === "RUNTIME_ERROR"){
    sessionData.messages.push({
      role:"assistant",
      content:`🟡运行时异常：${data.msg} 行:${data.line||''}`,
      error:true
    });
    renderChat();
    saveSession();
  }else if(data.type === "PROMISE_REJECT"){
    sessionData.messages.push({
      role:"assistant",
      content:`🟡Promise异常：${data.msg}`,
      error:true
    });
    renderChat();
    saveSession();
  }
});

function escapeHtml(str) {
  if (!str) return "";
  return str
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace( />/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function isDrawPrompt(text){
  return DRAW_KEYWORDS.some(k => text.includes(k));
}

async function testApiKey(key) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 10000);
  try {
    const resp = await fetch(LLM_BASE_URL, {
      method: "POST",
      headers: {
        "Authorization": `Bearer ${key}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        model: MODEL_CODE,
        messages: [{ role: "user", content: "hi" }],
        max_tokens: 5
      }),
      signal: controller.signal
    });
    clearTimeout(timer);
    return resp.ok;
  } catch (e) {
    clearTimeout(timer);
    return false;
  }
}

  const saved = localStorage.getItem(STORAGE_API_KEY);

    LLM_API_KEY = saved;

    if (ok) {
      enterMainApp();

    } else {
      localStorage.removeItem(STORAGE_API_KEY);

  apiKeyModal.classList.remove("hidden");
}

function makeResizable(container, leftCol, resizer, rightCol) {
  resizer.addEventListener('mousedown', function(e) {
    e.preventDefault();
    const startX = e.pageX;
    const startLeftWidth = leftCol.offsetWidth;
    const minLeft = parseInt(leftCol.style.minWidth);
    const minRight = parseInt(rightCol.style.minWidth);
    function mouseMove(e) {
      const deltaX = e.pageX - startX;
      let newWidth = startLeftWidth + deltaX;
      const containerW = container.clientWidth;
      newWidth = Math.max(minLeft, Math.min(newWidth, containerW - minRight));
      leftCol.style.width = newWidth + "px";
      leftCol.style.flex = "none";
    }
    function mouseUp() {
      document.removeEventListener('mousemove', mouseMove);
      document.removeEventListener('mouseup', mouseUp);
      saveLayoutWidth();
    }
    document.addEventListener('mousemove', mouseMove);
    document.addEventListener('mouseup', mouseUp);
  })
}

function saveLayoutWidth() {
  const layout = {
    leftW: document.getElementById("colLeft").offsetWidth,
    middleW: document.getElementById("colMiddle").offsetWidth,

    let w1 = Math.min(layout.leftW, totalW * 0.4);
    let w2 = Math.min(layout.middleW, totalW * 0.5);
    let w3 = Math.min(layout.rightW, totalW * 0.5);
    colLeft.style.width = w1 + "px";
    colLeft.style.flex = "none";
    colMiddle.style.width = w2 + "px";
    colMiddle.style.flex = "none";
    colRight.style.width = w3 + "px";
    colRight.style.flex = "none";
  } catch (e) {
    console.warn("布局配置损坏，使用默认布局");
  }
}

// ==========【轻量增强容错解析器】==========
function parseThinkAndHtml(rawText) {
  const thinkMark = "【思考】";
  const htmlMark = "【HTML】";
  let thinkText = "";
  let htmlText = "";
  let isTruncated = false;

  const idxThink = rawText.indexOf(thinkMark);
  const idxHtml = rawText.indexOf(htmlMark);

  if(idxThink !== -1 && idxHtml !== -1 && idxHtml > idxThink){
    thinkText = rawText.substring(idxThink + thinkMark.length, idxHtml).trim();
    const htmlRaw = rawText.substring(idxHtml + htmlMark.length).trim();
    const startHtml = htmlRaw.indexOf('<!DOCTYPE html>');
    const endHtml = htmlRaw.lastIndexOf('</html>');
    if (startHtml !== -1 && endHtml !== -1) {
      htmlText = htmlRaw.substring(startHtml, endHtml + 7).trim();
    } else if(startHtml !== -1){
      htmlText = htmlRaw.substring(startHtml).trim();
      isTruncated = true;
    }
  }else{
    const startHtml = rawText.indexOf('<!DOCTYPE html>');
    const endHtml = rawText.lastIndexOf('</html>');
    if (startHtml !== -1 && endHtml !== -1) {
      htmlText = rawText.substring(startHtml, endHtml + 7).trim();
    }else if(startHtml !== -1){
      htmlText = rawText.substring(startHtml).trim();
      isTruncated = true;
    }
    thinkText = rawText.replace(htmlText,"").trim();
  }
  return {thinkText, htmlText, isTruncated};
}

// ========== JS语法预检模块 ==========
function preCheckJsSyntax(fullHtml) {
  const scriptReg = /<script\b[^>]*>([\s\S]*?)<\/script>/gi;
  let match;
  const jsBlocks = [];
  while ((match = scriptReg.exec(fullHtml)) !== null) {
    jsBlocks.push(match[1]);
  }
  if (jsBlocks.length === 0) {
    return {ok:true, msg:"未检测到JS代码", error:null};
  }
  for(const js of jsBlocks){
    try{
      new Function(js);
    }catch(err){
      return {
        ok:false,
        msg:`JS语法检测失败：${err.message}`,
        error:err
      }
    }
  }
  return {ok:true, msg:"JS语法校验通过（⚠️仅语法，不校验业务/交互算法逻辑）", error:null};
}

function renderChat(loadingIndex = -1) {
  chatContainer.innerHTML = "";
  sessionData.messages.forEach((msg, index) => {
    const div = document.createElement("div");
    div.classList.add("msg-fade-in");
    if (msg.role === "user") {
      div.className += " bg-blue-800 p-3 rounded-md text-white";
      div.innerHTML = `<div class="text-sm opacity-80 mb-1">你</div>${escapeHtml(msg.content)}`;
    } else {
      if (loadingIndex === index) {
        div.className += " bg-gray-700 p-3 rounded-md text-white";
        div.innerHTML = `<div class="text-sm opacity-80 mb-1">AI智能体</div><div class="flex items-center gap-2"><i class="fa fa-circle-o-notch spin text-lg"></i> 正在生成代码，请稍候…</div>`;
      } else if (msg.error) {
        div.className += " bg-red-900/70 p-3 rounded-md text-white";
        div.innerHTML = `<div class="text-sm opacity-80 mb-1">AI智能体</div><div class="flex items-center gap-1"><i class="fa fa-times"></i> ${escapeHtml(msg.content)}</div>`;
      } else {
        div.className += " bg-gray-700 p-3 rounded-md text-white";
        div.innerHTML = `<div class="text-sm opacity-80 mb-1">AI智能体</div><div class="flex items-center gap-1"><i class="fa fa-check text-green-400"></i> ${escapeHtml(msg.content)}</div>`;
      }
    }
    chatContainer.appendChild(div);
  })
  chatContainer.scrollTop = chatContainer.scrollHeight;
}

async function typeWriter(element, fullText, speed = 45) {
  isTyping = true;
  try {
    let currentText = "";
    for (let i = 0; i < fullText.length; i++) {
      currentText += fullText[i];
      element.innerHTML = `<div class="text-sm opacity-80 mb-1">AI智能体</div><div class="flex items-center gap-1"><i class="fa fa-check text-green-400"></i> ${escapeHtml(currentText)}<span class="opacity-70">|</span></div>`;
      chatContainer.scrollTop = chatContainer.scrollHeight;
      await new Promise(resolve => setTimeout(resolve, speed));
    }
    element.innerHTML = `<div class="text-sm opacity-80 mb-1">AI智能体</div><div class="flex items-center gap-1"><i class="fa fa-check text-green-400"></i> ${escapeHtml(fullText)}</div>`;
  } finally {
    isTyping = false;
  }
}

        if(n.nodeType===3){
          if(n.textContent && n.textContent.includes("NaN")){
            parent.postMessage({type:"WARN_NAN",msg:"⚠️预览页面检测到DOM渲染出NaN文本，代码存在数值计算bug"},'*');
          }
        }
      }
    });
    observer.observe(document.body,{childList:true,subtree:true,characterData:true});

    window.onerror = function(msg,url,line,col,err){
      parent.postMessage({type:"RUNTIME_ERROR",msg:String(msg),line,col},'*');
    };
    window.addEventListener('unhandledrejection',e=>{
      parent.postMessage({type:"PROMISE_REJECT",msg:e.reason?.message||String(e.reason)},'*');
    })
})();
<\/script>
`;
  let finalHtml;
  const headIdx = html.indexOf("<head>");
  if(headIdx !==-1){
    finalHtml = html.slice(0,headIdx+6) + injectMonitor + html.slice(headIdx+6);
  }else{
    finalHtml = injectMonitor + html;
  }

  sessionData.generatedCode = html;
  codeEditor.value = html;
  saveSession();
  previewIframe.srcdoc = finalHtml;
}

// 通用LLM调用，支持自定义systemPrompt
async function callGLMWithSysPrompt(prompt, sysPrompt, isDraw=false) {
  const model = isDraw ? MODEL_DRAW : MODEL_CODE;
  const messages = [
    { role: "system", content: sysPrompt },
    { role: "user", content: prompt }
  ]
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), LLM_TIMEOUT_MS);
  try {
    const resp = await fetch(LLM_BASE_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${LLM_API_KEY}`
      },
      body: JSON.stringify({
        model: model,
        messages: messages,
        temperature: LLM_TEMPERATURE
      }),
      signal: controller.signal
    })
    clearTimeout(timeoutId);
    if (!resp.ok) {
      throw new Error(`HTTP ${resp.status}`);
    }
    const json = await resp.json();
    if (!json.choices || json.choices.length === 0) {
      throw new Error("模型返回异常");
    }
    return json.choices[0].message.content.trim();
  } catch (err) {
    clearTimeout(timeoutId);
    throw err;
  }
}

// ==========【核心：生成 + 自动评审 + 自动修复循环】 ==========
async function generateAndAutoFix(userPrompt){
  let currentHtml = "";
  let round = 0;
  // 第一轮原始生成
  const raw = await callGLMWithSysPrompt(userPrompt, systemPrompt, isDrawPrompt(userPrompt));
  let parsed = parseThinkAndHtml(raw);
  currentHtml = parsed.htmlText;

  const checkRet = preCheckJsSyntax(currentHtml);
  let logMsg = parsed.thinkText || "✅ 已生成网页应用代码";
  if(parsed.isTruncated) logMsg += "\n⚠️警告：模型输出被截断，代码不完整，请手动补全";
  if(!checkRet.ok){
    logMsg += `\n⚠️【JS语法错误预警】${checkRet.msg}，预览大概率交互异常`;
  }else{
    logMsg += `\n【JS预检】${checkRet.msg}`;
  }

  // 添加第一轮输出到会话
  sessionData.messages.push({role:"assistant", content: logMsg});
  renderChat();
  let msgDom = chatContainer.lastElementChild;
  await typeWriter(msgDom, logMsg);
  renderPreview(currentHtml);

  // 自动修复循环
  while(round < MAX_FIX_RETRY){
    round +=1;
    // 执行评审
    const reviewInput = `请评审下面网页代码:\n${currentHtml}`;
    const reviewReport = await callGLMWithSysPrompt(reviewInput, testReviewSystemPrompt);
    // 输出评审报告
    sessionData.messages.push({role:"assistant", content:`====第${round}轮自动评审报告====\n`+reviewReport});
    renderChat();
    msgDom = chatContainer.lastElementChild;
    await typeWriter(msgDom, `====第${round}轮自动评审报告====\n`+reviewReport);

    if(!hasHighRisk(reviewReport)){
      sessionData.messages.push({role:"assistant", content:"✅本轮评审未发现🔴高风险缺陷，停止自动修复流程"});
      renderChat();
      msgDom = chatContainer.lastElementChild;
      await typeWriter(msgDom,"✅本轮评审未发现🔴高风险缺陷，停止自动修复流程");
      break;
    }
    if(round >= MAX_FIX_RETRY){
      sessionData.messages.push({role:"assistant", content:`⚠️已经到达最大修复轮次${MAX_FIX_RETRY}，停止自动修复，请手动修改代码`});
      renderChat();
      msgDom = chatContainer.lastElementChild;
      await typeWriter(msgDom,`⚠️已经到达最大修复轮次${MAX_FIX_RETRY}，停止自动修复，请手动修改代码`);
      break;
    }
    // 触发修复
    sessionData.messages.push({role:"assistant", content:`🔴检测到高风险bug，开始执行第${round}轮自动修复`});
    renderChat();
    msgDom = chatContainer.lastElementChild;
    await typeWriter(msgDom,`🔴检测到高风险bug，开始执行第${round}轮自动修复`);

    const fixPrompt = `原始HTML代码：
${currentHtml}

测试评审bug报告：
${reviewReport}

请根据报告修复全部高风险缺陷。`;
    const fixRaw = await callGLMWithSysPrompt(fixPrompt, fixCodeSystemPrompt);
    const fixParsed = parseThinkAndHtml(fixRaw);
    currentHtml = fixParsed.htmlText;
    const fixCheck = preCheckJsSyntax(currentHtml);
    let fixLog = fixParsed.thinkText || "✅完成修复";
    if(fixParsed.isTruncated) fixLog += "\n⚠️修复输出被截断";
    if(!fixCheck.ok) fixLog +=`\n⚠️修复后JS语法错误：${fixCheck.msg}`;

    sessionData.messages.push({role:"assistant", content:fixLog});
    renderChat();
    msgDom = chatContainer.lastElementChild;
    await typeWriter(msgDom, fixLog);
    renderPreview(currentHtml);
  }
  saveSession();
  return currentHtml;
}

// 发送按钮，替换为自动生成+评审+修复入口
sendBtn.onclick = async () => {
  const content = userInput.value.trim();
  if (!content || isTyping) return;

  if(sessionData.messages.length >=6){
    if(!confirm("当前会话消息较多，容易超时/格式错乱，建议新建会话，是否继续发送？")){
      return;
    }
  }

  sendBtn.disabled = true;
  sendBtn.classList.add("opacity-60", "cursor-not-allowed");
  sendBtn.innerHTML = `<i class="fa fa-circle-o-notch spin"></i> 生成+自动评审修复中…`;
  codeEditor.readOnly = true;
  codeEditor.classList.add("opacity-60");
  sessionData.messages.push({ role: "user", content });
  userInput.value = "";
  renderChat();
  try {
    isTyping = true;
    await generateAndAutoFix(content);
  } catch (err) {
    let msg = err.message;
    if(err.name === 'AbortError') msg = "请求超时，请降低需求复杂度重试，或新建会话";
    sessionData.messages.push({ role: "assistant", content: "生成/修复失败：" + msg, error: true });
    renderChat();
  } finally {
    sendBtn.disabled = false;
    sendBtn.classList.remove("opacity-60", "cursor-not-allowed");
    sendBtn.innerHTML = `<i class="fa fa-paper-plane"></i> 发送，让AI生成应用`;
    codeEditor.readOnly = false;
    codeEditor.classList.remove("opacity-60");
    isTyping = false;
    saveSession();
  }
}

// 手动评审按钮
reviewBtn.onclick = async ()=>{
  const codeText = codeEditor.value.trim();
  if(!codeText){
    alert("编辑器没有代码，无法执行评审");
    return;
  }
  if(isTyping){
    alert("正在处理请求，请等待完成");
    return;
  }
  reviewBtn.disabled = true;
  reviewBtn.classList.add("opacity-60");
  isTyping = true;
  sessionData.messages.push({role:"user",content:"执行AI代码评审"});
  sessionData.messages.push({role:"assistant",content:"loading"});
  const loadingIdx = sessionData.messages.length -1;
  renderChat(loadingIdx);
  try{
    const reviewPrompt = `请评审下面网页代码:\n${codeText}`;
    const report = await callGLMWithSysPrompt(reviewPrompt, testReviewSystemPrompt);
    sessionData.messages[loadingIdx] = {role:"assistant", content: report};
    renderChat();
    const msgDom = chatContainer.lastElementChild;
    await typeWriter(msgDom, report,25);
  }catch(err){
    let errMsg = err.name==='AbortError'?"评审请求超时":err.message;
    sessionData.messages[loadingIdx] = {role:"assistant", content:"评审失败："+errMsg, error:true};
    renderChat();
  }finally{
    reviewBtn.disabled = false;
    reviewBtn.classList.remove("opacity-60");
    isTyping = false;
    saveSession();
  }
}

userInput.addEventListener('keydown', function(e){
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    sendBtn.click();
  }
})

newSessionBtn.onclick = () => {
  if (isTyping) return;
  sessionData = { messages: [], generatedCode: "" };
  saveSession();
  renderChat();
  codeEditor.value = "";
  previewIframe.srcdoc = "";
}

clearChatBtn.onclick = () => {
  if(isTyping) return;
  sessionData.messages = [];
  saveSession();
  renderChat();
}

exportBtn.onclick = () => {
  const html = codeEditor.value;
  if (!html.trim()) {
    exportBtn.textContent = "暂无代码";
    setTimeout(() => exportBtn.innerHTML = `<i class="fa fa-download"></i> 导出HTML`, 1200);
    return;
  }
  const blob = new Blob([html], { type: "text/html" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "output.html";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

codeEditor.oninput = () => {
  renderPreview(codeEditor.value);
}

function bootstrapApp() {
  makeResizable(document.querySelector(".container-row"), colLeft, resizer1, colMiddle);
  makeResizable(document.querySelector(".container-row"), colMiddle, resizer2, document.getElementById("colRight"));
  loadLayoutWidth();
  loadSession();
}

window.onload = function () {
  initKeyFlow();
}
