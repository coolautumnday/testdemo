<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI网页生成器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#2563eb',
            panel: '#1e293b',
            codeBg: '#1e293b'
          }
        }
      }
    }
  </script>
  <style type="text/tailwindcss">
    @layer utilities {
      .scrollbar-thin::-webkit-scrollbar { width: 6px; }
      .scrollbar-thin::-webkit-scrollbar-thumb { background:#555; border-radius:3px; }
      .scrollbar-thin::-webkit-scrollbar-track { background:transparent; }
      .spin { animation: spin 1s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .msg-fade-in { animation: fadeIn 0.35s ease-out; }
      @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
      .pulse-dot span { animation: pulseDot 1.4s infinite; }
      .pulse-dot span:nth-child(2) {animation-delay:0.2s;}
      .pulse-dot span:nth-child(3) {animation-delay:0.4s;}
      @keyframes pulseDot{0%,100%{opacity:0.2;}50%{opacity:1;}}
    }
  </style>
  <style>
    *{box-sizing:border-box;}
    body,html{height:100%;margin:0;padding:0;overflow:hidden;}
    .container-row{display:flex;height:calc(100vh - 48px);}
    .col-left{display:flex;flex-direction:column;height:100%;overflow:hidden;flex:0 0 25%;}
    .col-middle,.col-right{display:flex;flex-direction:column;height:100%;overflow:hidden;flex:0 0 37.5%;}
    #sendBtn{transition:all 0.25s ease;}
    #apiKeyModal{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:9999;display:flex;align-items:center;justify-content:center;}
    #apiKeyModal.hidden{display:none;}
    .agent-status-item{display:flex;align-items:center;gap:8px;padding:4px 0;}
    .think-msg{background-color:#2c3444 !important;border-left:3px solid #60a5fa;}
    textarea.user-textarea{overflow-y:auto;}
    /* 登录注册样式 */
    #authPage{height:100vh;display:flex;align-items:center;justify-content:center;background:#111827;}
    #authPage.hidden{display:none;}
    #mainAppWrap{height:100vh;display:flex;flex-direction:column;}
    #mainAppWrap.hidden{display:none;}
    .auth-tab{cursor:pointer;padding:8px 16px;border-bottom:2px solid transparent;}
    .auth-tab.active{border-color:#2563eb;color:#2563eb;}

    /* 密码输入框带眼睛按钮 */
    .password-wrap{position:relative;}
    .password-wrap input{padding-right:36px !important;}
    .password-eye{
      position:absolute;
      right:10px;
      top:50%;
      transform:translateY(-50%);
      cursor:pointer;
      color:#aaa;
    }
    .password-eye:hover{color:#fff;}
  </style>
</head>
<body class="bg-gray-900 text-white">
<!-- ========== 登录注册页面 ========== -->
<div id="authPage">
  <div class="w-full max-w-sm bg-panel rounded-lg p-6 border border-gray-700">
    <h1 class="text-xl font-bold text-center mb-4">AI网页生成器</h1>
    <div class="flex mb-4">
      <div id="tabLogin" class="auth-tab active flex-1 text-center">登录</div>
      <div id="tabRegister" class="auth-tab flex-1 text-center">注册</div>
    </div>
    <!-- 登录表单 -->
    <div id="loginForm">
      <div class="mb-3">
        <label class="text-sm text-gray-300">用户名</label>
        <input id="loginUsername" type="text" class="w-full mt-1 bg-gray-800 rounded p-2 border border-gray-600 outline-none text-white">
      </div>
      <div class="mb-3">
        <label class="text-sm text-gray-300">密码</label>
        <div class="password-wrap mt-1">
          <input id="loginPwd" type="password" class="w-full bg-gray-800 rounded p-2 border border-gray-600 outline-none text-white">
          <i class="fa fa-eye password-eye" data-target="loginPwd"></i>
        </div>
      </div>
      <div id="loginTip" class="text-sm text-red-400 h-5 mb-3"></div>
      <button id="loginBtn" class="w-full bg-primary py-2 rounded hover:bg-blue-600 transition">登录</button>
    </div>
    <!-- 注册表单 -->
    <div id="registerForm" class="hidden">
      <div class="mb-3">
        <label class="text-sm text-gray-300">用户名</label>
        <input id="regUsername" type="text" class="w-full mt-1 bg-gray-800 rounded p-2 border border-gray-600 outline-none text-white">
      </div>
      <div class="mb-3">
        <label class="text-sm text-gray-300">密码</label>
        <div class="password-wrap mt-1">
          <input id="regPwd" type="password" class="w-full bg-gray-800 rounded p-2 border border-gray-600 outline-none text-white">
          <i class="fa fa-eye password-eye" data-target="regPwd"></i>
        </div>
      </div>
      <div class="mb-3">
        <label class="text-sm text-gray-300">确认密码</label>
        <div class="password-wrap mt-1">
          <input id="regPwd2" type="password" class="w-full bg-gray-800 rounded p-2 border border-gray-600 outline-none text-white">
          <i class="fa fa-eye password-eye" data-target="regPwd2"></i>
        </div>
      </div>
      <div id="regTip" class="text-sm h-5 mb-3"></div>
      <button id="registerBtn" class="w-full bg-primary py-2 rounded hover:bg-blue-600 transition">注册账号</button>
    </div>
  </div>
</div>
<!-- API Key弹窗 -->
<div id="apiKeyModal" class="hidden">
  <div class="bg-panel p-6 rounded-lg w-full max-w-md border border-gray-700">
    <h2 class="text-lg font-bold mb-2">配置智谱API Key</h2>
    <p class="text-gray-400 text-sm mb-4">仅输入你的API‑Key，接口地址与模型名称已内置。密钥仅保存在浏览器本地 localStorage。</p>
    <input id="apiKeyInput" type="password" placeholder="输入你的智谱API Key"
           class="w-full bg-gray-800 rounded p-2 border border-gray-600 focus:border-blue-400 outline-none mb-4 text-white">
    <div id="modalTip" class="text-sm mb-3 h-5"></div>
    <div class="flex gap-2">
      <button id="modalCancelBtn" class="flex-1 bg-gray-600 py-2 rounded hover:bg-gray-500 transition">取消</button>
      <button id="modalConnectBtn" class="flex-1 bg-primary py-2 rounded hover:bg-blue-600 transition">验证并进入应用</button>
    </div>
  </div>
</div>
<div id="mainAppWrap" class="hidden">
  <!-- 顶部用户栏 -->
  <div class="h-12 bg-panel border-b border-gray-700 flex items-center justify-between px-4">
    <div class="font-bold">AI网页生成器</div>
    <div class="flex items-center gap-3">
      <span id="curUserText" class="text-sm text-gray-300"></span>
      <button id="configApiKeyBtn" class="bg-blue-700 px-3 py-1 rounded text-sm hover:bg-blue-600">
        <i class="fa fa-key"></i> 配置API‑Key
      </button>
      <button id="clearApiKeyBtn" class="bg-red-700 px-2 py-1 rounded text-xs hover:bg-red-600">清除Key</button>
      <button id="logoutBtn" class="bg-red-700 px-3 py-1 rounded text-sm hover:bg-red-600">
        <i class="fa fa-sign-out"></i> 退出登录
      </button>
    </div>
  </div>
<div class="container-row">
  <div class="col-left bg-panel border-r border-gray-700" id="colLeft">
    <div class="p-4 border-b border-gray-700 flex justify-between items-center">
      <h2 class="text-lg font-bold text-white">智能体对话</h2>
      <div class="flex gap-2">
        <button id="newSessionBtn" class="bg-primary px-3 py-1 rounded text-sm hover:bg-blue-600 transition-colors">新建会话</button>
        <button id="clearChatBtn" class="bg-gray-600 px-3 py-1 rounded text-sm hover:bg-gray-500 transition-colors">清空对话</button>
      </div>
    </div>
    <div id="chatContainer" class="flex-1 overflow-y-auto p-3 scrollbar-thin space-y-3"></div>
    <div class="p-3 border-t border-gray-700">
      <textarea id="userInput" class="user-textarea w-full bg-gray-800 rounded p-2 h-24 resize-none outline-none border border-gray-600 text-white transition-colors focus:border-blue-400 scrollbar-thin" placeholder="输入你的想法，例如：做一个番茄钟网页 / 画一个太阳"></textarea>
      <div class="flex items-center justify-between mt-2 mb-2">
        <label class="flex items-center gap-2 text-sm cursor-pointer select-none">
          <input id="simpleModeCheck" type="checkbox">
          <span>简易模式(跳过产品分析，减少超时)</span>
        </label>
        <button id="stopBtn" disabled class="bg-red-600 px-3 py-1 rounded text-sm opacity-50 cursor-not-allowed hover:bg-red-700 transition-colors">
          <i class="fa fa-stop"></i> 停止
        </button>
      </div>
      <button id="sendBtn" class="w-full bg-primary py-2 rounded hover:bg-blue-600 flex items-center justify-center gap-2 text-white">
        <i class="fa fa-paper-plane"></i> 发送，让AI生成应用
      </button>
    </div>
  </div>
  <div class="col-middle bg-codeBg border-r border-gray-700" id="colMiddle">
    <div class="p-3 border-b border-gray-600 flex justify-between gap-2">
      <h2 class="font-bold text-white">生成代码</h2>
      <div class="flex gap-2">
        <button id="reviewBtn" class="bg-orange-600 px-3 py-1 rounded text-sm hover:bg-orange-700 text-white transition-colors">
          <i class="fa fa-search"></i> AI代码评审
        </button>
        <button id="exportBtn" class="bg-green-600 px-3 py-1 rounded text-sm hover:bg-green-700 text-white transition-colors">
          <i class="fa fa-download"></i> 导出HTML
        </button>
      </div>
    </div>
    <textarea id="codeEditor" class="flex-1 w-full bg-transparent p-3 text-sm font-mono outline-none resize-none scrollbar-thin text-white overflow-y-auto" spellcheck="false"></textarea>
  </div>
  <div class="col-right bg-white" id="colRight">
    <div class="p-3 border-b border-gray-200">
      <h2 class="font-bold text-gray-800">应用预览（可交互）</h2>
    </div>
    <iframe id="previewIframe" sandbox="allow-scripts" class="flex-1 w-full bg-white" style="border:none;"></iframe>
  </div>
</div>
</div>
<script>
// ========= 常量定义 =========
const CONST = {
  LLM_BASE_URL: "https://open.bigmodel.cn/api/paas/v4/chat/completions",
  MODEL_CODE: "glm-4-flash",
  MODEL_DRAW: "glm-4v-flash",
  LLM_TEMPERATURE: 0.7,
  LLM_TIMEOUT_MS: 300000,
  STORAGE_API_KEY: "demo_llm_api_key",
  STORAGE_KEY: "atoms-demo-session",
  STORAGE_USERS: "app_user_list",
  STORAGE_LOGIN: "app_login_session",
  MAX_FIX_RETRY: 3,
  MAX_SESSION_MSG_COUNT: 30,
  AGENT_STATUS: {
    PRODUCT:"product",
    ENGINEER:"engineer",
    TESTER_REVIEW:"tester_review",
    PRODUCT_VERIFY:"product_verify",
    DONE:"done"
  }
};
const DRAW_KEYWORDS = ["绘制图片","画一张","画个图","画图标","绘制图形","画像","画画","绘制图案"];
const AppState = {
  LLM_API_KEY: "",
  isTyping: false,
  globalAbortController: null,
  isManualAbort: false,
  forceTerminateRender: false,
  sessionData: { messages:[], generatedCode:"", lastProductReport:"" },
  currentUser: null
};
class ManualAbortError extends Error {
  constructor(msg){
    super(msg);
    this.name = "ManualAbortError";
  }
}
const Dom = {
  authPage: document.getElementById("authPage"),
  tabLogin: document.getElementById("tabLogin"),
  tabRegister: document.getElementById("tabRegister"),
  loginForm: document.getElementById("loginForm"),
  registerForm: document.getElementById("registerForm"),
  loginUsername: document.getElementById("loginUsername"),
  loginPwd: document.getElementById("loginPwd"),
  loginTip: document.getElementById("loginTip"),
  loginBtn: document.getElementById("loginBtn"),
  regUsername: document.getElementById("regUsername"),
  regPwd: document.getElementById("regPwd"),
  regPwd2: document.getElementById("regPwd2"),
  regTip: document.getElementById("regTip"),
  registerBtn: document.getElementById("registerBtn"),
  curUserText: document.getElementById("curUserText"),
  logoutBtn: document.getElementById("logoutBtn"),
  configApiKeyBtn: document.getElementById("configApiKeyBtn"),
  apiKeyModal: document.getElementById("apiKeyModal"),
  apiKeyInput: document.getElementById("apiKeyInput"),
  modalCancelBtn: document.getElementById("modalCancelBtn"),
  modalConnectBtn: document.getElementById("modalConnectBtn"),
  modalTip: document.getElementById("modalTip"),
  mainAppWrap: document.getElementById("mainAppWrap"),
  stopBtn: document.getElementById("stopBtn"),
  simpleModeCheck: document.getElementById("simpleModeCheck"),
  chatContainer: document.getElementById("chatContainer"),
  userInput: document.getElementById("userInput"),
  sendBtn: document.getElementById("sendBtn"),
  newSessionBtn: document.getElementById("newSessionBtn"),
  clearChatBtn: document.getElementById("clearChatBtn"),
  clearApiKeyBtn: document.getElementById("clearApiKeyBtn"),
  codeEditor: document.getElementById("codeEditor"),
  previewIframe: document.getElementById("previewIframe"),
  exportBtn: document.getElementById("exportBtn"),
  reviewBtn: document.getElementById("reviewBtn")
};

// ========= 密码显示隐藏切换逻辑 =========
document.querySelectorAll('.password-eye').forEach(eye=>{
  eye.addEventListener('click',function(){
    const targetId = this.getAttribute('data-target');
    const input = document.getElementById(targetId);
    if(input.type === 'password'){
      input.type = 'text';
      this.classList.remove('fa-eye');
      this.classList.add('fa-eye-slash');
    }else{
      input.type = 'password';
      this.classList.remove('fa-eye-slash');
      this.classList.add('fa-eye');
    }
  })
})

function shrinkThinkText(text, maxLen = 550){
  if(!text) return "";
  if(text.length <= maxLen) return text;
  return text.slice(0, maxLen) + "\n……(内容已精简截断)";
}
// ====================== 【加强版统一停止函数】 ======================
/**
 * 加强停止：立即终止网络、全部打字循环、智能体思考打印
 */
function doStopLogic(){
  // 强制全部终止标记，所有异步打字循环立刻判断退出
  AppState.isManualAbort = true;
  AppState.forceTerminateRender = true;
  AppState.isTyping = false;
  // 中断网络请求
  if(AppState.globalAbortController){
    AppState.globalAbortController.abort();
    AppState.globalAbortController = null;
  }
  resetAgentLoadingStatus();
  setUiIdle();
}
// ====================== 登录注册模块 ======================
function getUserList(){
  const raw = localStorage.getItem(CONST.STORAGE_USERS);
  if(!raw) return [];
  try{ return JSON.parse(raw); }catch(e){ return []; }
}
function saveUserList(list){
  localStorage.setItem(CONST.STORAGE_USERS, JSON.stringify(list));
}
function getLoginSession(){
  const s = localStorage.getItem(CONST.STORAGE_LOGIN);
  if(!s) return null;
  try{ return JSON.parse(s); }catch(e){ return null; }
}
function setLoginSession(userObj){
  localStorage.setItem(CONST.STORAGE_LOGIN, JSON.stringify(userObj));
}
function clearLoginSession(){
  localStorage.removeItem(CONST.STORAGE_LOGIN);
}
Dom.tabLogin.onclick = ()=>{
  Dom.tabLogin.classList.add("active");
  Dom.tabRegister.classList.remove("active");
  Dom.loginForm.classList.remove("hidden");
  Dom.registerForm.classList.add("hidden");
  Dom.loginTip.textContent = "";
  Dom.regTip.textContent = "";
};
Dom.tabRegister.onclick = ()=>{
  Dom.tabRegister.classList.add("active");
  Dom.tabLogin.classList.remove("active");
  Dom.registerForm.classList.remove("hidden");
  Dom.loginForm.classList.add("hidden");
  Dom.loginTip.textContent = "";
  Dom.regTip.textContent = "";
};
Dom.registerBtn.onclick = ()=>{
  const u = Dom.regUsername.value.trim();
  const p1 = Dom.regPwd.value;
  const p2 = Dom.regPwd2.value;
  Dom.regTip.textContent = "";
  Dom.regTip.className = "text-sm h-5 mb-3 text-red-400";
  if(!u){ Dom.regTip.textContent="请输入用户名"; return; }
  if(p1.length<3){ Dom.regTip.textContent="密码至少3位"; return; }
  if(p1!==p2){ Dom.regTip.textContent="两次密码不一致"; return; }
  const users = getUserList();
  const exist = users.find(x=>x.username === u);
  if(exist){
    Dom.regTip.textContent="该用户名已被注册";
    return;
  }
  const newUser = { username:u, password:p1 };
  users.push(newUser);
  saveUserList(users);
  Dom.regTip.className = "text-sm h-5 mb-3 text-green-400";
  Dom.regTip.textContent="✅注册成功，请去登录";
  setTimeout(()=>{
    Dom.tabLogin.click();
    Dom.loginUsername.value = u;
  },600);
};
Dom.loginBtn.onclick = ()=>{
  const u = Dom.loginUsername.value.trim();
  const p = Dom.loginPwd.value;
  Dom.loginTip.textContent="";
  if(!u || !p){ Dom.loginTip.textContent="请填写用户名密码"; return; }
  const users = getUserList();
  const find = users.find(x=>x.username === u && x.password === p);
  if(!find){
    Dom.loginTip.textContent="用户名或密码错误";
    return;
  }
  setLoginSession({username:u});
  AppState.currentUser = {username:u};
  enterAppAfterLogin();
};
// 【退出登录：先执行停止，再清空会话跳转登录页】
Dom.logoutBtn.onclick = ()=>{
  if(!confirm("确定要退出登录吗？会话会清空，API‑key保留本地")) return;
  // 退出登录前：强制停止所有智能体、网络、打字输出
  doStopLogic();
  clearLoginSession();
  AppState.currentUser = null;
  AppState.sessionData = { messages:[], generatedCode:"", lastProductReport:"" };
  showAuthPage();
};
function showAuthPage(){
  Dom.authPage.classList.remove("hidden");
  Dom.mainAppWrap.classList.add("hidden");
  Dom.apiKeyModal.classList.add("hidden");
}
function enterAppAfterLogin(){
  Dom.authPage.classList.add("hidden");
  Dom.mainAppWrap.classList.remove("hidden");
  Dom.curUserText.textContent = "当前用户：" + AppState.currentUser.username;
  initKeyFlow();
}
function checkAuthAndBoot(){
  const session = getLoginSession();
  if(session && session.username){
    AppState.currentUser = {username: session.username};
    enterAppAfterLogin();
  }else{
    showAuthPage();
  }
}
Dom.modalCancelBtn.onclick = ()=>{
  Dom.apiKeyModal.classList.add("hidden");
};
Dom.configApiKeyBtn.onclick = ()=>{
  Dom.apiKeyInput.value = AppState.LLM_API_KEY || "";
  Dom.modalTip.textContent = "";
  Dom.apiKeyModal.classList.remove("hidden");
};
// ========= 业务工具函数 =========
function hasApiKey(){
  if(!AppState.LLM_API_KEY){
    alert("尚未配置 API Key，请先配置");
    return false;
  }
  return true;
}
function resetRequestState(){
  AppState.isManualAbort = false;
  AppState.forceTerminateRender = false;
}
Dom.stopBtn.onclick = ()=>{
  doStopLogic();
};
function setUiBusy(){
  Dom.sendBtn.disabled=true; Dom.sendBtn.classList.add("opacity-60","cursor-not-allowed");
  Dom.sendBtn.innerHTML=`<i class="fa fa-circle-o-notch spin"></i> 多智能体处理中…`;
  Dom.codeEditor.readOnly=true; Dom.codeEditor.classList.add("opacity-60");
  Dom.stopBtn.disabled=false; Dom.stopBtn.classList.remove("opacity-50","cursor-not-allowed");
}
function setUiIdle(){
  Dom.sendBtn.disabled=false; Dom.sendBtn.classList.remove("opacity-60","cursor-not-allowed");
  Dom.sendBtn.innerHTML=`<i class="fa fa-paper-plane"></i> 发送，让AI生成应用`;
  Dom.codeEditor.readOnly=false; Dom.codeEditor.classList.remove("opacity-60");
  Dom.stopBtn.disabled=true; Dom.stopBtn.classList.add("opacity-50","cursor-not-allowed");
}
function resetAgentLoadingStatus(){
  AppState.sessionData.messages.forEach(m=>{if(m.agentStatus) m.agentStatus=CONST.AGENT_STATUS.DONE;});
  renderChat();
}
window.addEventListener('message',evt=>{
  const d=evt.data;
  if(!d||!d.type) return;
  const map={
    WARN_NAN:"🔴运行时告警："+d.msg,
    RUNTIME_ERROR:`🟡运行时异常：${d.msg} 行:${d.line||''}`,
    PROMISE_REJECT:`🟡Promise异常：${d.msg}`
  };
  if(map[d.type]){
    AppState.sessionData.messages.push({role:"assistant",content:map[d.type],error:true});
    renderChat(); saveSession();
  }
});
function renderAgentStatus(msgIndex,status){
  AppState.sessionData.messages[msgIndex].agentStatus=status;
  renderChat();
}
function escapeHtml(str){
  if(!str) return "";
  let s = String(str);
  if(s.length>25000){
    s = s.slice(0,25000)+"\n……(内容过长已截断)";
  }
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace( />/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}
const isDrawPrompt = text=> DRAW_KEYWORDS.some(k=>text.includes(k));
async function testApiKey(key){
  const c=new AbortController();
  const t=setTimeout(()=>c.abort(),10000);
  try{
    const res=await fetch(CONST.LLM_BASE_URL,{
      method:"POST",signal:c.signal,
      headers:{"Authorization":`Bearer ${key}`,"Content-Type":"application/json"},
      body:JSON.stringify({model:CONST.MODEL_CODE,messages:[{role:"user",content:"hi"}],max_tokens:5})
    });
    clearTimeout(t);
    if(!res.ok) return false;
    return true;
  }catch(e){ clearTimeout(t); return false; }
}
function backToKeyModal(){
  AppState.LLM_API_KEY="";
  Dom.apiKeyInput.value="";
  Dom.modalTip.textContent="";
  Dom.apiKeyModal.classList.remove("hidden");
}
async function initKeyFlow(){
  const saved=localStorage.getItem(CONST.STORAGE_API_KEY);
  if(saved){
    AppState.LLM_API_KEY=saved;
    const ok=await testApiKey(AppState.LLM_API_KEY);
    if(ok){ enterMainApp(); return; }
    localStorage.removeItem(CONST.STORAGE_API_KEY);
  }
  Dom.apiKeyModal.classList.remove("hidden");
}
Dom.modalConnectBtn.onclick=async()=>{
  const val=Dom.apiKeyInput.value.trim();
  if(!val){ Dom.modalTip.textContent="请输入API Key"; Dom.modalTip.className="text-sm mb-3 h-5 text-red-400"; return; }
  Dom.modalConnectBtn.disabled=true; Dom.modalConnectBtn.textContent="正在验证..."; Dom.modalTip.textContent="";
  AppState.LLM_API_KEY=val;
  const ok=await testApiKey(val);
  if(ok){

function parseThinkAndHtml(rawText) {
  const thinkMark="【思考】",htmlMark="【HTML】";
  let thinkText="",htmlText="",isTruncated=false;
  const idxThink=rawText.indexOf(thinkMark),idxHtml=rawText.indexOf(htmlMark);
  if(idxThink!==-1&&idxHtml!==-1&&idxHtml>idxThink){
    thinkText=rawText.substring(idxThink+thinkMark.length,idxHtml).trim();
    const htmlRaw=rawText.substring(idxHtml+htmlMark.length).trim();
    const s=htmlRaw.indexOf('<!DOCTYPE html>'),e=htmlRaw.lastIndexOf('</html>');
    if(s!==-1&&e!==-1) htmlText=htmlRaw.substring(s,e+7).trim();
    else if(s!==-1){ htmlText=htmlRaw.substring(s).trim(); isTruncated=true; }
  }else{
    const s=rawText.indexOf('<!DOCTYPE html>'),e=rawText.lastIndexOf('</html>');
    if(s!==-1&&e!==-1) htmlText=rawText.substring(s,e+7).trim();
    else if(s!==-1){ htmlText=rawText.substring(s).trim(); isTruncated=true; }
    thinkText=rawText.replace(htmlText,"").trim();
  }
  return {thinkText,htmlText,isTruncated};
}
function preCheckJsSyntax(fullHtml){
  const reg=/<script\b[^>]*>([\s\S]*?)<\/script>/gi;
  let match,blocks=[];
  while((match=reg.exec(fullHtml))!==null) blocks.push(match[1]);
  if(/on\w+="/.test(fullHtml)){
    return {ok:true,msg:"JS语法校验：检测到HTML内联事件，无法做静态语法校验，请预览测试",error:null};
  }
  if(blocks.length===0) return {ok:true,msg:"未检测到JS代码",error:null};
  for(const js of blocks){
    try{
      const fakeCode = "(function(){\n"+js+"\n})()";
      new Function(fakeCode);
    }catch(err){
      if(err.message.includes("await")||err.message.includes("import")){
        return {ok:true,msg:"JS语法校验：存在顶层await/import，newFunction无法校验，跳过",error:null};
      }
      return {ok:false,msg:`JS语法检测失败：${err.message}`,error:err};
    }
  }
  return {ok:true,msg:"JS语法校验通过（⚠️仅语法，不校验业务/交互算法逻辑）",error:null};
}

function renderPreview(html){

(function(){

    m.forEach(mut=>{
      mut.addedNodes.forEach(n=>{

          parent.postMessage({type:"WARN_NAN",msg:"⚠️预览页面检测到DOM渲染出NaN文本，代码存在数值计算bug"},'*');
        }
      })
    })
  });
  o.observe(document.body,{childList:true,subtree:true,characterData:true});
  window.onerror=(msg,url,line,col)=>parent.postMessage({type:"RUNTIME_ERROR",msg:String(msg),line,col},'*');
  window.addEventListener('unhandledrejection',e=>parent.postMessage({type:"PROMISE_REJECT",msg:e.reason?.message||String(e.reason)},'*'));
})();
<\/script>`;
  let finalHtml;
  const headIdx=html.indexOf("<head>");
  finalHtml= headIdx!==-1 ? html.slice(0,headIdx+6)+injectMonitor+html.slice(headIdx+6) : injectMonitor+html;
  AppState.sessionData.generatedCode=html;

async function callGLMWithSysPrompt(prompt,sysPrompt,isDraw=false){
  const controller = new AbortController();
  AppState.globalAbortController = controller;
  const model=isDraw?CONST.MODEL_DRAW:CONST.MODEL_CODE;
  const messages=[{role:"system",content:sysPrompt},{role:"user",content:prompt}];
  const t=setTimeout(()=>controller.abort(),CONST.LLM_TIMEOUT_MS);
  try{
    const resp=await fetch(CONST.LLM_BASE_URL,{
      method:"POST",signal:controller.signal,
      headers:{"Content-Type":"application/json","Authorization":`Bearer ${AppState.LLM_API_KEY}`},
      body:JSON.stringify({model,messages,temperature:CONST.LLM_TEMPERATURE})
    });
    clearTimeout(t);
    if(!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const json=await resp.json();
    if(!json.choices||!json.choices.length) throw new Error("模型返回异常");
    return json.choices[0].message.content.trim();
  }catch(err){
    clearTimeout(t);
    if(controller.signal.aborted){
      throw new ManualAbortError("请求被手动终止");
    }
    throw err;
  }finally{
    if(AppState.globalAbortController === controller){
      AppState.globalAbortController = null;
    }
  }
}

    await typeWriter(Dom.chatContainer.lastElementChild,AppState.sessionData.messages[verifyMsgIdx].content);
    if(!hasMediumOrHighRisk(rawReview)){
      const txt="✅本轮评审+产品复核未检测到中/高风险缺陷，自动修复流程结束";
      AppState.sessionData.messages.push({role:"assistant",content:txt});
      renderChat();
      await typeWriter(Dom.chatContainer.lastElementChild,txt);
      break;
    }
    if(round>=CONST.MAX_FIX_RETRY){
      const txt=`⚠️已经到达最大修复轮次${CONST.MAX_FIX_RETRY}，停止自动修复，请手动修改代码`;
      AppState.sessionData.messages.push({role:"assistant",content:txt});
      renderChat();
      await typeWriter(Dom.chatContainer.lastElementChild,txt);
      break;
    }
    const fixTip=`🔴🟡检测到中/高风险缺陷，开始执行第${round}轮自动修复`;
    AppState.sessionData.messages.push({role:"assistant",content:fixTip});
    renderChat();
    await typeWriter(Dom.chatContainer.lastElementChild,fixTip);
    const fixPrompt=`原始HTML代码：
${currentHtml}
产品复核报告（需要修复中风险、高风险问题）：
${rawVerify}
请根据报告修复全部中、高风险缺陷。`;
    const rawFix=await callGLMWithSysPrompt(fixPrompt,fixCodeSystemPrompt);
    await showAgentThink("🔹工程师Agent思考(修复)",rawFix);
    const fixParsed=parseThinkAndHtml(rawFix);
    currentHtml=fixParsed.htmlText;
    const fixCheck=preCheckJsSyntax(currentHtml);
    let fixLog=fixParsed.thinkText||"✅完成修复";
    if(fixParsed.isTruncated) fixLog+="\n⚠️修复输出被截断";
    if(!fixCheck.ok) fixLog+=`\n⚠️修复后JS语法错误：${fixCheck.msg}`;
    AppState.sessionData.messages.push({role:"assistant",content:fixLog});
    renderChat();
    await typeWriter(Dom.chatContainer.lastElementChild,fixLog);
    renderPreview(currentHtml);
  }
  saveSession();
  return currentHtml;
}
Dom.sendBtn.onclick=async()=>{
  const content=Dom.userInput.value.trim();
  if(!content||AppState.isTyping) return;
  if(!hasApiKey()) return;
  if(!(AppState.sessionData.messages.length <6?true:confirm("当前会话消息较多，容易超时/格式错乱，建议新建会话，是否继续？"))) return;
  resetRequestState();
  const simpleMode=Dom.simpleModeCheck.checked;
  setUiBusy();
  AppState.sessionData.messages.push({role:"user",content}); Dom.userInput.value=""; renderChat();
  try{
    AppState.isTyping=true; await generateAndAutoFix(content,simpleMode);
  }catch(err){
    const msg = err instanceof ManualAbortError ? "🛑请求已被手动停止" : ("生成/修复失败："+err.message);
    AppState.sessionData.messages.push({role:"assistant",content:msg,error:true});
    resetAgentLoadingStatus(); renderChat();
  }finally{ setUiIdle(); AppState.isTyping=false; saveSession(); }
};
Dom.reviewBtn.onclick=async()=>{
  const codeText=Dom.codeEditor.value.trim();
  if(!codeText){ alert("编辑器没有代码，无法执行评审"); return; }
  if(AppState.isTyping){ alert("正在处理请求，请等待完成"); return; }
  if(!hasApiKey()) return;
  if(!(AppState.sessionData.messages.length <6?true:confirm("当前会话消息较多，容易超时/格式错乱，建议新建会话，是否继续？"))) return;
  resetRequestState();
  setUiBusy();
  AppState.sessionData.messages.push({role:"user",content:"执行AI代码评审"});
  AppState.sessionData.messages.push({role:"assistant",content:"loading"});
  const loadingIdx=AppState.sessionData.messages.length-1;
  renderChat();
  try{
    const rawReview=await callGLMWithSysPrompt(`请评审下面网页代码:\n${codeText}`,testReviewSystemPrompt);
    await showAgentThink("🔹测试Agent思考",rawReview);
    AppState.sessionData.messages[loadingIdx]={role:"assistant",content:rawReview};
    renderChat();
    await typeWriter(Dom.chatContainer.lastElementChild,rawReview,25);
  }catch(err){
    const errMsg = err instanceof ManualAbortError ? "🛑评审请求已被手动停止" : ("评审请求异常:"+err.message);
    AppState.sessionData.messages[loadingIdx]={role:"assistant",content:errMsg,error:true};
    resetAgentLoadingStatus(); renderChat();
  }finally{ setUiIdle(); AppState.isTyping=false; saveSession(); }
};
Dom.userInput.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey&&!AppState.isTyping){
    e.preventDefault();
    Dom.sendBtn.click();
  }
});
Dom.newSessionBtn.onclick=()=>{
  doStopLogic();
  AppState.sessionData={messages:[],generatedCode:"",lastProductReport:""};
  saveSession();
  renderChat();
  Dom.codeEditor.value="";
  Dom.previewIframe.srcdoc="";
};
Dom.clearChatBtn.onclick=()=>{
  if(AppState.isTyping) return;
  AppState.sessionData.messages=[]; saveSession(); renderChat();
};
Dom.exportBtn.onclick=()=>{
  const html=Dom.codeEditor.value;
  if(!html.trim()){
    Dom.exportBtn.classList.add("opacity-60");
    const oldHtml = Dom.exportBtn.innerHTML;
    Dom.exportBtn.innerHTML = `<i class="fa fa-download"></i> 暂无代码`;
    setTimeout(()=>{
      Dom.exportBtn.innerHTML = oldHtml;
      Dom.exportBtn.classList.remove("opacity-60");
    },1200);
    return;
  }
  const blob=new Blob([html],{type:"text/html"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download="output.html"; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
};
Dom.codeEditor.oninput=()=>{
  AppState.sessionData.generatedCode = Dom.codeEditor.value;
  renderPreview(Dom.codeEditor.value);
};
function bootstrapApp(){ loadSession(); }
window.onload=()=>{
  checkAuthAndBoot();
};
</script>
</body>
