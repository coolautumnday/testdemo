}

// 监听iframe运行时消息：NaN告警、JS异常
window.addEventListener('message',(evt)=>{
  const data = evt.data;
  if(!data || !data.type) return;
  if(data.type === "WARN_NAN"){
    sessionData.messages.push({
      role:"assistant",
      content:"🔴运行时告警："+data.msg,
      error:true
    });
    renderChat();
    saveSession();
  }else if(data.type === "RUNTIME_ERROR"){
    sessionData.messages.push({
      role:"assistant",
      content:`🟡运行时异常：${data.msg} 行:${data.line||''}`,
      error:true
    });
    renderChat();
    saveSession();
  }else if(data.type === "PROMISE_REJECT"){
    sessionData.messages.push({
      role:"assistant",
      content:`🟡Promise异常：${data.msg}`,
      error:true
    });
    renderChat();
    saveSession();
  }
});

/**
 * @param {number} msgIndex 消息下标
 * @param {string} status AGENT_STATUS
 */
function renderAgentStatus(msgIndex, status){
  const item = sessionData.messages[msgIndex];
  item.agentStatus = status;
  renderChat(msgIndex);
}

function escapeHtml(str) {
  if (!str) return "";
  return str
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace( />/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}
function isDrawPrompt(text){
  return DRAW_KEYWORDS.some(k => text.includes(k));
}
async function testApiKey(key) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 10000);
  try {
    const resp = await fetch(LLM_BASE_URL, {
      method: "POST",
      headers: {
        "Authorization": `Bearer ${key}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        model: MODEL_CODE,
        messages: [{ role: "user", content: "hi" }],
        max_tokens: 5
      }),
      signal: controller.signal
    });
    clearTimeout(timer);
    return resp.ok;
  } catch (e) {
    clearTimeout(timer);
    return false;
  }
}
function backToKeyModal() {
  LLM_API_KEY = "";
  mainAppWrap.classList.add("hidden");
  apiKeyModal.classList.remove("hidden");
  apiKeyInput.value = "";
  modalTip.textContent = "";
}
async function initKeyFlow() {
  const saved = localStorage.getItem(STORAGE_API_KEY);
  if (saved) {
    LLM_API_KEY = saved;
    const ok = await testApiKey(LLM_API_KEY);
    if (ok) {
      enterMainApp();
      return;
    } else {
      localStorage.removeItem(STORAGE_API_KEY);
    }
  }
  apiKeyModal.classList.remove("hidden");
}
modalConnectBtn.onclick = async () => {
  const val = apiKeyInput.value.trim();
  if (!val) {
    modalTip.textContent = "请输入API Key";
    modalTip.className = "text-sm mb-3 h-5 text-red-400";
    return;
  }
  modalConnectBtn.disabled = true;
  modalConnectBtn.textContent = "正在验证...";
  modalTip.textContent = "";
  LLM_API_KEY = val;
  const ok = await testApiKey(val);
  if (ok) {
    localStorage.setItem(STORAGE_API_KEY, val);
    modalTip.textContent = "✅ 验证成功";
    modalTip.className = "text-sm mb-3 h-5 text-green-400";
    setTimeout(enterMainApp, 600);
  } else {
    modalTip.textContent = "❌ Key校验失败，请检查";
    modalTip.className = "text-sm mb-3 h-5 text-red-400";
  }
  modalConnectBtn.disabled = false;
  modalConnectBtn.textContent = "验证并进入应用";
};
function enterMainApp() {

// ==========【轻量增强容错解析器】==========
function parseThinkAndHtml(rawText) {
  const thinkMark = "【思考】";
  const htmlMark = "【HTML】";
  let thinkText = "";
  let htmlText = "";
  let isTruncated = false;
  const idxThink = rawText.indexOf(thinkMark);
  const idxHtml = rawText.indexOf(htmlMark);
  if(idxThink !== -1 && idxHtml !== -1 && idxHtml > idxThink){
    thinkText = rawText.substring(idxThink + thinkMark.length, idxHtml).trim();
    const htmlRaw = rawText.substring(idxHtml + htmlMark.length).trim();
    const startHtml = htmlRaw.indexOf('<!DOCTYPE html>');
    const endHtml = htmlRaw.lastIndexOf('</html>');
    if (startHtml !== -1 && endHtml !== -1) {
      htmlText = htmlRaw.substring(startHtml, endHtml + 7).trim();
    } else if(startHtml !== -1){
      htmlText = htmlRaw.substring(startHtml).trim();
      isTruncated = true;
    }
  }else{
    const startHtml = rawText.indexOf('<!DOCTYPE html>');
    const endHtml = rawText.lastIndexOf('</html>');
    if (startHtml !== -1 && endHtml !== -1) {
      htmlText = rawText.substring(startHtml, endHtml + 7).trim();
    }else if(startHtml !== -1){
      htmlText = rawText.substring(startHtml).trim();
      isTruncated = true;
    }
    thinkText = rawText.replace(htmlText,"").trim();
  }
  return {thinkText, htmlText, isTruncated};
}

// ========== JS语法预检模块 ==========
function preCheckJsSyntax(fullHtml) {
  const scriptReg = /<script\b[^>]*>([\s\S]*?)<\/script>/gi;
  let match;
  const jsBlocks = [];
  while ((match = scriptReg.exec(fullHtml)) !== null) {
    jsBlocks.push(match[1]);
  }
  if (jsBlocks.length === 0) {
    return {ok:true, msg:"未检测到JS代码", error:null};
  }
  for(const js of jsBlocks){
    try{
      new Function(js);
    }catch(err){
      return {
        ok:false,
        msg:`JS语法检测失败：${err.message}`,
        error:err
      }
    }
  }
  return {ok:true, msg:"JS语法校验通过（⚠️仅语法，不校验业务/交互算法逻辑）", error:null};
}

    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      sessionData = JSON.parse(saved);
    }
  } catch (e) {
    console.warn("会话数据损坏，重置会话");
    sessionData = { messages: [], generatedCode: "", lastProductReport:"" };
  }
  renderChat();
  codeEditor.value = sessionData.generatedCode;
  renderPreview(sessionData.generatedCode);
}
function saveSession() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(sessionData));
  } catch (err) {
    console.warn("localStorage存储超限，保存会话失败", err);
  }
}

async function typeWriter(element, fullText, speed = 45) {
  isTyping = true;
  try {
    let currentText = "";
    for (let i = 0; i < fullText.length; i++) {
      if(!isTyping) break;
      currentText += fullText[i];
      element.innerHTML = `<div class="text-sm opacity-80 mb-1">AI智能体</div><div class="flex items-center gap-1"><i class="fa fa-check text-green-400"></i> ${escapeHtml(currentText)}<span class="opacity-70">|</span></div>`;
      await new Promise(resolve => setTimeout(resolve, speed));
    }
    if(isTyping){
      element.innerHTML = `<div class="text-sm opacity-80 mb-1">AI智能体</div><div class="flex items-center gap-1"><i class="fa fa-check text-green-400"></i> ${escapeHtml(fullText)}</div>`;
    }
  } finally {
    isTyping = false;
  }
}

// 注入iframe运行时监控脚本，检测DOM出现NaN、捕获异常
function renderPreview(html) {
  const injectMonitor = `
<script>
(function(){
  const observer = new MutationObserver((mutations)=>{
    for(let m of mutations){
      for(let n of m.addedNodes){
        if(n.nodeType===1){
          if(n.textContent && n.textContent.includes("NaN")){
            parent.postMessage({type:"WARN_NAN",msg:"⚠️预览页面检测到DOM渲染出NaN文本，代码存在数值计算bug"},'*');
          }
        }
        if(n.nodeType===3){
          if(n.textContent && n.textContent.includes("NaN")){
            parent.postMessage({type:"WARN_NAN",msg:"⚠️预览页面检测到DOM渲染出NaN文本，代码存在数值计算bug"},'*');
          }
        }
      }
    });
    observer.observe(document.body,{childList:true,subtree:true,characterData:true});
    window.onerror = function(msg,url,line,col,err){
      parent.postMessage({type:"RUNTIME_ERROR",msg:String(msg),line,col},'*');
    };
    window.addEventListener('unhandledrejection',e=>{
      parent.postMessage({type:"PROMISE_REJECT",msg:e.reason?.message||String(e.reason)},'*');
    })
})();
<\/script>
`;
  let finalHtml;
  const headIdx = html.indexOf("<head>");
  if(headIdx !==-1){
    finalHtml = html.slice(0,headIdx+6) + injectMonitor + html.slice(headIdx+6);
  }else{
    finalHtml = injectMonitor + html;
  }
  sessionData.generatedCode = html;
  codeEditor.value = html;
  saveSession();
  previewIframe.srcdoc = finalHtml;
}

// 通用LLM调用，支持自定义systemPrompt
async function callGLMWithSysPrompt(prompt, sysPrompt, isDraw=false) {
  globalAbortController = new AbortController();
  const model = isDraw ? MODEL_DRAW : MODEL_CODE;
  const messages = [
    { role: "system", content: sysPrompt },
    { role: "user", content: prompt }
  ]
  const controller = globalAbortController;
  const timeoutId = setTimeout(() => controller.abort(), LLM_TIMEOUT_MS);
  try {
    const resp = await fetch(LLM_BASE_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${LLM_API_KEY}`
      },
      body: JSON.stringify({
        model: model,
        messages: messages,
        temperature: LLM_TEMPERATURE
      }),
      signal: controller.signal
    })
    clearTimeout(timeoutId);
    if (!resp.ok) {
      throw new Error(`HTTP ${resp.status}`);
    }
    const json = await resp.json();
    if (!json.choices || json.choices.length === 0) {
      throw new Error("模型返回异常");
    }
    return json.choices[0].message.content.trim();
  } catch (err) {
    clearTimeout(timeoutId);
    throw err;
  }
}

// ==========【核心完整链路：产品→工程师→测试评审→产品复核→修复中/高风险】 ==========
async function generateAndAutoFix(userPrompt, simpleMode){
  let currentHtml = "";
  let round = 0;
  const assistMsgIdx = sessionData.messages.length;
  sessionData.messages.push({role:"assistant", content:"", agentStatus: simpleMode ? AGENT_STATUS.ENGINEER : AGENT_STATUS.PRODUCT});
  renderAgentStatus(assistMsgIdx, simpleMode ? AGENT_STATUS.ENGINEER : AGENT_STATUS.PRODUCT);

  let engineerInput;
  let productReport = "";
  if(!simpleMode){
    productReport = await callGLMWithSysPrompt(userPrompt, productAgentSystemPrompt);
    sessionData.lastProductReport = productReport;
    renderAgentStatus(assistMsgIdx, AGENT_STATUS.ENGINEER);
    engineerInput = `用户原始需求：
${userPrompt}
下面是产品经理输出的需求分析报告，请依据这份报告实现网页：
${productReport}`;
  }else{
    engineerInput = userPrompt;
  }

  const raw = await callGLMWithSysPrompt(engineerInput, simpleMode ? simpleModeSystemPrompt : systemPrompt, isDrawPrompt(userPrompt));
  let parsed = parseThinkAndHtml(raw);
  currentHtml = parsed.htmlText;
  const checkRet = preCheckJsSyntax(currentHtml);

  let logMsg = "";
  if(!simpleMode){
    logMsg = "📋【产品需求分析报告】\n"+productReport+"\n\n"+(parsed.thinkText || "✅ 已生成网页应用代码");
  }else{
    logMsg = "⚡【简易模式：跳过产品分析】\n"+(parsed.thinkText || "✅ 已生成网页应用代码");
  }
  if(parsed.isTruncated) logMsg += "\n⚠️警告：模型输出被截断，代码不完整，请手动补全";
  if(!checkRet.ok){
    logMsg += `\n⚠️【JS语法错误预警】${checkRet.msg}，预览大概率交互异常`;
  }else{
    logMsg += `\n【JS预检】${checkRet.msg}`;
  }

  renderAgentStatus(assistMsgIdx, AGENT_STATUS.DONE);
  sessionData.messages[assistMsgIdx].content = logMsg;
  renderChat();
  let msgDom = chatContainer.lastElementChild;
  await typeWriter(msgDom, logMsg);
  renderPreview(currentHtml);

  // 循环：评审 -> 产品复核 -> 修复中/高风险
  while(round < MAX_FIX_RETRY && isTyping){
    round +=1;
    // 1.测试评审
    const reviewMsgIdx = sessionData.messages.length;
    sessionData.messages.push({role:"assistant",content:"",agentStatus:AGENT_STATUS.TESTER_REVIEW});
    renderAgentStatus(reviewMsgIdx,AGENT_STATUS.TESTER_REVIEW);
    const reviewInput = `请评审下面网页代码:\n${currentHtml}`;
    const reviewReport = await callGLMWithSysPrompt(reviewInput, testReviewSystemPrompt);
    renderAgentStatus(reviewMsgIdx,AGENT_STATUS.DONE);
    sessionData.messages[reviewMsgIdx].content = `====第${round}轮 测试评审报告====\n`+reviewReport;
    renderChat();
    msgDom = chatContainer.lastElementChild;
    await typeWriter(msgDom, sessionData.messages[reviewMsgIdx].content);

    // 2.产品复核，对比需求分析报告
    const verifyMsgIdx = sessionData.messages.length;
    sessionData.messages.push({role:"assistant",content:"",agentStatus:AGENT_STATUS.PRODUCT_VERIFY});
    renderAgentStatus(verifyMsgIdx,AGENT_STATUS.PRODUCT_VERIFY);
    const verifyPrompt = `原始用户需求：${userPrompt}
【需求分析报告】
${simpleMode?"简易模式无产品需求报告":sessionData.lastProductReport}
【代码测试评审报告】
${reviewReport}
请做产品复核，对比渲染实现和需求报告，识别中风险及以上问题业务影响。`;
    const productVerifyResult = await callGLMWithSysPrompt(verifyPrompt, productVerifySystemPrompt);
    renderAgentStatus(verifyMsgIdx,AGENT_STATUS.DONE);
    sessionData.messages[verifyMsgIdx].content = `====第${round}轮 产品复核结果====\n`+productVerifyResult;
    renderChat();
    msgDom = chatContainer.lastElementChild;
    await typeWriter(msgDom, sessionData.messages[verifyMsgIdx].content);

    // 判断是否存在中/高风险，无则退出循环
    if(!hasMediumOrHighRisk(reviewReport)){
      sessionData.messages.push({role:"assistant", content:"✅本轮评审+产品复核未检测到中/高风险缺陷，自动修复流程结束"});
      renderChat();
      msgDom = chatContainer.lastElementChild;
      await typeWriter(msgDom,"✅本轮评审+产品复核未检测到中/高风险缺陷，自动修复流程结束");
      break;
    }
    if(round >= MAX_FIX_RETRY){
      sessionData.messages.push({role:"assistant", content:`⚠️已经到达最大修复轮次${MAX_FIX_RETRY}，停止自动修复，请手动修改代码`});
      renderChat();
      msgDom = chatContainer.lastElementChild;
      await typeWriter(msgDom,`⚠️已经到达最大修复轮次${MAX_FIX_RETRY}，停止自动修复，请手动修改代码`);
      break;
    }

    // 执行修复：依据产品复核报告修复中高风险
    sessionData.messages.push({role:"assistant", content:`🔴🟡检测到中/高风险缺陷，开始执行第${round}轮自动修复`});
    renderChat();
    msgDom = chatContainer.lastElementChild;
    await typeWriter(msgDom,`🔴🟡检测到中/高风险缺陷，开始执行第${round}轮自动修复`);

    const fixPrompt = `原始HTML代码：
${currentHtml}
产品复核报告（需要修复中风险、高风险问题）：
${productVerifyResult}
请根据报告修复全部中、高风险缺陷。`;
    const fixRaw = await callGLMWithSysPrompt(fixPrompt, fixCodeSystemPrompt);
    const fixParsed = parseThinkAndHtml(fixRaw);
    currentHtml = fixParsed.htmlText;
    const fixCheck = preCheckJsSyntax(currentHtml);

    let fixLog = fixParsed.thinkText || "✅完成修复";
    if(fixParsed.isTruncated) fixLog += "\n⚠️修复输出被截断";
    if(!fixCheck.ok) fixLog +=`\n⚠️修复后JS语法错误：${fixCheck.msg}`;

    sessionData.messages.push({role:"assistant", content:fixLog});
    renderChat();
    msgDom = chatContainer.lastElementChild;
    await typeWriter(msgDom, fixLog);
    renderPreview(currentHtml);
  }
  saveSession();
  return currentHtml;
}

// 发送按钮
sendBtn.onclick = async () => {
  const content = userInput.value.trim();
  if (!content || isTyping) return;
  if(sessionData.messages.length >=6){
    if(!confirm("当前会话消息较多，容易超时/格式错乱，建议新建会话，是否继续发送？")){
      return;
    }
  }
  const simpleMode = simpleModeCheck.checked;
  setUiBusy();
  sessionData.messages.push({ role: "user", content });
  userInput.value = "";
  renderChat();
  try {
    isTyping = true;
    await generateAndAutoFix(content, simpleMode);
  } catch (err) {
    let msg = err.message;
    if(err.name === 'AbortError') msg = "请求已被手动停止";
    sessionData.messages.push({ role: "assistant", content: "生成/修复失败：" + msg, error: true });
    resetAgentLoadingStatus();
    renderChat();
  } finally {
    setUiIdle();
    isTyping = false;
    saveSession();
  }
}

// 手动评审按钮
reviewBtn.onclick = async ()=>{
  const codeText = codeEditor.value.trim();
  if(!codeText){
    alert("编辑器没有代码，无法执行评审");
    return;
  }
  if(isTyping){
    alert("正在处理请求，请等待完成");
    return;
  }
  setUiBusy();
  isTyping = true;
  sessionData.messages.push({role:"user",content:"执行AI代码评审"});
  sessionData.messages.push({role:"assistant",content:"loading"});
  const loadingIdx = sessionData.messages.length -1;
  renderChat(loadingIdx);
  try{
    const reviewPrompt = `请评审下面网页代码:\n${codeText}`;
    const report = await callGLMWithSysPrompt(reviewPrompt, testReviewSystemPrompt);
    sessionData.messages[loadingIdx] = {role:"assistant", content: report};
    renderChat();
    const msgDom = chatContainer.lastElementChild;
    await typeWriter(msgDom, report,25);
  }catch(err){
    let errMsg = err.name==='AbortError'?"评审请求已停止":"评审请求异常:"+err.message;
    sessionData.messages[loadingIdx] = {role:"assistant", content:"评审失败："+errMsg, error:true};
    resetAgentLoadingStatus();
    renderChat();
  }finally{
    setUiIdle();
    isTyping = false;
    saveSession();
  }
}

userInput.addEventListener('keydown', function(e){
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    sendBtn.click();
  }
})

newSessionBtn.onclick = () => {
  if (isTyping) return;
  sessionData = { messages: [], generatedCode: "", lastProductReport:"" };
  saveSession();
  renderChat();
  codeEditor.value = "";
  previewIframe.srcdoc = "";
}

clearChatBtn.onclick = () => {
  if(isTyping) return;
  sessionData.messages = [];
  saveSession();
  renderChat();
}

exportBtn.onclick = () => {
  const html = codeEditor.value;
  if (!html.trim()) {
    exportBtn.textContent = "暂无代码";
    setTimeout(() => exportBtn.innerHTML = `<i class="fa fa-download"></i> 导出HTML`, 1200);
    return;
  }
  const blob = new Blob([html], { type: "text/html" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "output.html";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

codeEditor.oninput = () => {
  renderPreview(codeEditor.value);
}

function bootstrapApp() {
  loadSession();
}
window.onload = function () {
  initKeyFlow();
}
